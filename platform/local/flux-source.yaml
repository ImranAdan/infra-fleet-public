apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: fleet-local
  namespace: flux-system
  annotations:
    infra-fleet.io/checkout-mirror: "true"
spec:
  interval: 30s
  url: http://fleet-local-git.flux-system.svc.cluster.local:8080/cgi-bin/git/fleet.git
  ref:
    branch: fleet-local
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: fleet-root
  namespace: flux-system
spec:
  interval: 1m
  path: ./k8s/clusters/local
  prune: true
  sourceRef:
    kind: GitRepository
    name: fleet-local
  wait: false
