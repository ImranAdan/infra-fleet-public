apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: fleet-local
  namespace: flux-system
spec:
  interval: 30s
  url: git://fleet-local-git.flux-system.svc.cluster.local:9418/fleet.git
  ref:
    branch: fleet-local
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: fleet-root
  namespace: flux-system
spec:
  interval: 1m
  path: ./k8s/clusters/local
  prune: true
  sourceRef:
    kind: GitRepository
    name: fleet-local
  wait: false
