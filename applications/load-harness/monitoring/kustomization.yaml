# Grafana's dashboard sidecar loads every ConfigMap labelled grafana_dashboard=1,
# so these dashboards are provisioned from Git in every profile and survive
# Grafana restarts. Edit the JSON here; changes in the Grafana UI are not kept.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
configMapGenerator:
  - name: grafana-dashboard-load-harness
    files:
      - grafana-dashboard.json
  - name: grafana-dashboard-load-testing-overview
    files:
      - load-testing-overview.json
  - name: grafana-dashboard-dora-metrics
    files:
      - dora-metrics.json
