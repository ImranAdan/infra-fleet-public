# Local development setup with hot reload
#
# This file is in local-dev/ directory for better organization.
# All paths are relative to the parent directory (load-harness/)
#
# Usage from load-harness/:
#   docker-compose -f local-dev/docker-compose.yml up
#
# Or use the helper script:
#   ./local-dev/dev.sh up
#

services:
  load-harness:
    build: ..  # Build from parent directory (load-harness root)
    ports:
      - "8080:8080"
    volumes:
      - ../src:/app/src  # Mount source directory for hot reload
    env_file:
      - ../.env
    environment:
      - PYTHONPATH=/app/src
      - DEBUG_METRICS=1  # Enable Prometheus metrics
    # Run the app via the package, not a hardcoded path
    command: ["python", "-m", "load_harness.app"]

  # Test service - runs tests in same environment as app
  test:
    build:
      context: ..
      dockerfile: Dockerfile.test
    volumes:
      - ../src:/app/src
      - ../tests:/app/tests
      - ../package.json:/app/package.json:ro
      - ../requirements.txt:/app/requirements.txt:ro
      - ../Dockerfile:/app/Dockerfile:ro
      - ../Dockerfile.test:/app/Dockerfile.test:ro
    env_file:
      - ../.env
    environment:
      - PYTHONPATH=/app/src
    # -p no:cacheprovider: the image runs as non-root and /app is read-only to
    # it, so pytest cannot write .pytest_cache. The cache is worthless in a
    # throwaway container anyway, and without this every run emits a warning.
    command: ["pytest", "tests/", "-v", "-p", "no:cacheprovider"]
    profiles:
      - test

  # Prometheus - scrapes /metrics from load-harness
  # Access at: http://localhost:9090
  prometheus:
    image: prom/prometheus@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml  # Still in local-dev/
      - prometheus-data:/prometheus
    profiles:
      - observability

  # Grafana - visualization dashboards
  # Access at: http://localhost:3000 (login: admin/admin)
  # Dashboard auto-imported via setup script
  # Note: Pinned to 13.2.3 to match the cluster (kube-prometheus-stack 92.3.0)
  grafana:
    image: grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    profiles:
      - observability

volumes:
  prometheus-data:
  grafana-data:
