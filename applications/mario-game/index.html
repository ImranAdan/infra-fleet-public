<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fleet Runner</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <h1>Fleet Runner</h1>
    <canvas id="game" width="800" height="480" aria-label="Platform game"></canvas>
    <p>Arrows or A/D to run, Space or W to jump. Stomp the walkers, grab the coins, reach the flag.</p>
    <div class="pad" aria-hidden="true">
      <button data-key="ArrowLeft">◀</button>
      <button data-key="ArrowRight">▶</button>
      <button data-key="Space">Jump</button>
    </div>
  </main>
  <script src="/game.js"></script>
</body>
</html>
