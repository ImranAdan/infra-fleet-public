apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: block-default-namespace
  annotations:
    policies.kyverno.io/title: Block Default Namespace
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Workloads must declare a purpose-specific namespace instead of using
      the Kubernetes default namespace.
spec:
  validationActions: [Deny]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments, statefulsets, daemonsets]
      - apiGroups: [batch]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [jobs, cronjobs]
  validations:
    - expression: object.metadata.namespace != 'default'
      message: Using the default namespace is not allowed. Specify a purpose-specific namespace.
