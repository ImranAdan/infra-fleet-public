apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-ecr-images
  annotations:
    policies.kyverno.io/title: Require ECR Images
    policies.kyverno.io/category: Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Every application, init and ephemeral container must use an image from
      an AWS ECR registry.
spec:
  validationActions: [Deny]
  evaluation:
    background:
      enabled: true
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  matchConditions:
    - name: applications-namespace
      expression: object.metadata.namespace == 'applications'
  variables:
    - name: allContainers
      expression: >-
        object.spec.containers
        + object.spec.?initContainers.orValue([])
        + object.spec.?ephemeralContainers.orValue([])
  validations:
    - expression: >-
        variables.allContainers.all(container,
          container.image.matches('^[0-9]+\\.dkr\\.ecr\\.[a-z0-9-]+\\.amazonaws\\.com/.+'))
      message: Every application container image must come from an AWS ECR registry.
