# --- regressions found in review ----------------------------------------------

[[case]]
slug = "forged-receipts"
kind = "regression"
title = "Receipts decide() could not have produced, recorded or planted below record()"
threat = "forged evidence"
requirement = "record() refuses an unsupported AUTHORIZE, and reconcile fails closed on one planted in the ledger"
fixture = "forged_receipts"
expect = { "AUTHORIZE with its reasons deleted" = "refused CONTRACT_ERROR", "evidence about another head" = "refused CONTRACT_ERROR", "a class the delegation never declared" = "refused CONTRACT_ERROR", "a renamed decision ID" = "refused CONTRACT_ERROR", "an unsupported schema" = "refused CONTRACT_ERROR", "planted below record()" = "refused LEDGER_INVALID", "check after the planted receipt" = "failure LEDGER_INVALID" }

[[case]]
slug = "shared-head"
kind = "regression"
title = "Two open PRs share one head; one is undecided or closes"
threat = "identity collision"
requirement = "one check per commit is green only when every open PR on it is decided alone"
