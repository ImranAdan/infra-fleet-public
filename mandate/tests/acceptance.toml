expect = { "an undecided PR shares the head" = "failure AUTHORIZE (r1), head shared by 2 PRs", "the other PR closed" = "success AUTHORIZE (r1)", "the only open PR is undecided" = "refused CONTRACT_ERROR" }

[[case]]
