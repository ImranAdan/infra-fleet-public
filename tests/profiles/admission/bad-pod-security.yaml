apiVersion: v1
kind: Pod
metadata:
  name: fleet-test-bad-pod-security
  namespace: applications
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: fleet-local-registry:5000/load-harness:git-fixture
      securityContext:
        # The sole restricted-profile violation exercised by this fixture.
        allowPrivilegeEscalation: true
        capabilities:
          drop: [ALL]
        readOnlyRootFilesystem: true
