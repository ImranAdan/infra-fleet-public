apiVersion: v1
kind: Pod
metadata:
  name: local-images-good
  namespace: applications
spec:
  initContainers:
    - name: prepare
      image: fleet-local-registry:5000/load-harness:v1.0.0
  containers:
    - name: app
      image: fleet-local-registry:5000/load-harness:v1.0.0
    - name: helper
      image: fleet-local-registry:5000/load-harness:v1.0.1
---
apiVersion: v1
kind: Pod
metadata:
  name: local-images-bad-sidecar
  namespace: applications
spec:
  containers:
    - name: app
      image: fleet-local-registry:5000/load-harness:v1.0.0
    - name: sidecar
      image: ghcr.io/example/unapproved:v1.0.0
---
apiVersion: v1
kind: Pod
metadata:
  name: local-images-latest-sidecar
  namespace: applications
spec:
  containers:
    - name: app
      image: fleet-local-registry:5000/load-harness:v1.0.0
    - name: sidecar
      image: fleet-local-registry:5000/load-harness:latest
