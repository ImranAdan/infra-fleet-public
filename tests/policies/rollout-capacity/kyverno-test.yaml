apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: rollout-capacity
policies:
  - ../../../policies/require-rollout-capacity.yaml
resources:
  - resources.yaml
results:
  - policy: require-rollout-capacity
    isValidatingPolicy: true
    resources: [single, scaled]
    kind: Deployment
    result: pass
  - policy: require-rollout-capacity
    isValidatingPolicy: true
    resources:
      - implicit-defaults
      - unavailable-integer
      - unavailable-percent
      - zero-surge
      - percentage-surge
      - application-recreate
      - missing-readiness
      - empty-readiness
      - sidecar-missing-readiness
    kind: Deployment
    result: fail
  - policy: require-rollout-capacity
    isValidatingPolicy: true
    resources: [upstream-controller]
    kind: Deployment
    result: skip
