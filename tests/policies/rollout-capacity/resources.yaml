apiVersion: apps/v1
kind: Deployment
metadata:
  name: single
  namespace: applications
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fixture
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: fixture
    spec:
      containers:
        - name: app
          image: registry.example.test/app:v1.0.0
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
