name: Inspect or Clean Staging Resources (Manual)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Dry-run reports resources; live deletes staging Kubernetes-managed resources'
        required: true
        default: 'dry-run'
        type: choice
        options:
          - dry-run
          - live
      confirm_live_cleanup:
        description: 'Required confirmation when mode is live'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test-cleanup:
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      id-token: write   # Required for OIDC authentication
      contents: read    # Required to checkout code
    env:
      AWS_REGION: eu-west-2
      CLUSTER_NAME: staging

    steps:
      - name: Verify cleanup request
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          MODE: ${{ inputs.mode }}
          CONFIRMED: ${{ inputs.confirm_live_cleanup }}
          REQUEST_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$REQUEST_REF" != "refs/heads/main" ]; then
            echo "::error::Cleanup must be dispatched from main."
            exit 1
          fi
          if [ -z "$AWS_ROLE_ARN" ]; then
            echo "::error::AWS_GITHUB_ACTIONS_ROLE_ARN is not configured. See CONFIGURATION.md."
            exit 1
          fi
          if [ "$MODE" = "live" ] && [ "$CONFIRMED" != "true" ]; then
            echo "::error::Live cleanup requires confirm_live_cleanup."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          role-session-name: GitHubActions-TestDestroyCleanup-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run Kubernetes cleanup
        uses: ./.github/actions/cleanup-kubernetes-resources
        with:
          cluster-name: ${{ env.CLUSTER_NAME }}
          aws-region: ${{ env.AWS_REGION }}
          mode: ${{ inputs.mode }}
          run-verification: 'true'

      - name: Important Notice
        if: always()
        env:
          MODE: ${{ inputs.mode }}
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "IMPORTANT NOTICE"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""

          if [ "$MODE" = "dry-run" ]; then
            echo "   DRY RUN mode - No actual changes were made"
            echo ""
            echo "   To delete staging resources, run again with mode: live and confirm the cleanup"
          else
            echo "   LIVE CLEANUP completed"
            echo ""
            echo "   Resources may have been deleted."
            echo "   Note: This did NOT run terraform destroy."
            echo ""
            echo "   To fully destroy infrastructure, use the nightly-destroy workflow"
          fi

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
