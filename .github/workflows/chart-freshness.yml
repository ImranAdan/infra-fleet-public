name: Chart Freshness

# Dependabot cannot read Flux HelmRelease chart versions or the generated Flux
# manifest, so this is their routine version check. The monthly run fails when
# a chart or Flux is behind upstream and not held in
# scripts/check-chart-versions.py; GitHub then notifies the owner of the failed
# scheduled run. Pull requests only run the offline self-test, so upstream drift
# never blocks an unrelated change.

on:
  schedule:
    - cron: '23 6 1 * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/check-chart-versions.py'
      - '.github/workflows/chart-freshness.yml'

permissions:
  contents: read

jobs:
  check:
    name: Helm charts and Flux
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'

      - name: Install PyYAML
        run: python -m pip install PyYAML==6.0.3 --quiet

      - name: Self-test
        run: python scripts/check-chart-versions.py --self-test

      - name: Compare with upstream
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          python scripts/check-chart-versions.py | tee -a "$GITHUB_STEP_SUMMARY"
