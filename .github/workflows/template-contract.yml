name: Template Contract

on:
  pull_request:
    paths:
      - '.github/**'
      - 'infrastructure/**'
      - 'k8s/**'
      - 'scripts/**'
      - 'fleet'
      - 'platform/**'
      - 'tests/profiles/**'
      - 'CONFIGURATION.md'
      - 'config.example.env'
      - '.release-please-manifest.json'
      - 'release-please-config.json'
      - 'applications/load-harness/local-dev/**'
      - 'ops/**'
  push:
    branches: [main]
    paths:
      - '.github/**'
      - 'infrastructure/**'
      - 'k8s/**'
      - 'scripts/**'
      - 'fleet'
      - 'platform/**'
      - 'tests/profiles/**'
      - 'CONFIGURATION.md'
      - 'config.example.env'
      - '.release-please-manifest.json'
      - 'release-please-config.json'
      - 'applications/load-harness/local-dev/**'
      - 'ops/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pinned profile renderer
        run: |
          ./scripts/install-profile-tools.sh "$RUNNER_TEMP/fleet-bin"
          echo "$RUNNER_TEMP/fleet-bin" >> "$GITHUB_PATH"

      - name: Validate template invariants
        run: ./scripts/validate-template-contract.sh

      # Dependabot bumps the git-server base image but not its apk package
      # pins. Reuse this runner instead of creating a second check and runner.
      - name: Build local Git server image
        run: docker build --tag fleet-local-git-server:ci platform/local/git-server
