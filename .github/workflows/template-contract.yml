name: Template Contract

on:
  pull_request:
    paths:
      - '.github/**'
      - 'infrastructure/**'
      - 'k8s/**'
      - 'scripts/**'
      - 'fleet'
      - 'platform/**'
      - 'tests/profiles/**'
      - 'CONFIGURATION.md'
      - 'config.example.env'
      - '.release-please-manifest.json'
      - 'release-please-config.json'
      - 'applications/load-harness/local-dev/**'
      - 'ops/**'
  push:
    branches: [main]
    paths:
      - '.github/**'
      - 'infrastructure/**'
      - 'k8s/**'
      - 'scripts/**'
      - 'fleet'
      - 'platform/**'
      - 'tests/profiles/**'
      - 'CONFIGURATION.md'
      - 'config.example.env'
      - '.release-please-manifest.json'
      - 'release-please-config.json'
      - 'applications/load-harness/local-dev/**'
      - 'ops/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install pinned profile renderer
        run: |
          ./scripts/install-profile-tools.sh "$RUNNER_TEMP/fleet-bin"
          echo "$RUNNER_TEMP/fleet-bin" >> "$GITHUB_PATH"

      - name: Validate template invariants
        run: ./scripts/validate-template-contract.sh

  # Dependabot bumps the git-server base image but not its apk package pins.
  # Building the image here makes a bump whose Alpine release dropped those
  # pinned revisions fail review instead of breaking `./fleet up` later.
  local-git-server-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Build local Git server image
        run: docker build --tag fleet-local-git-server:ci platform/local/git-server
