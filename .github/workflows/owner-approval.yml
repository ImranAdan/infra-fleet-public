name: Owner approval handoff

# Issue comments run trusted default-branch workflow code. This job only wakes
# the merge worker; merge_ready.py authenticates the owner, SHA and timing.
on:
  issue_comment:
    types: [created]

permissions:
  contents: write

jobs:
  wake:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/approve ')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Wake the trusted merge worker
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          jq -n --arg pr "$PR_NUMBER" \
            '{event_type: "autonomous-merge-recovery", client_payload: {priority_pr: $pr}}' \
            | gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" --input -
