# --------------------------------------------------------------------------------------------------
# Kubernetes Manifest Validation Workflow
# Sequential validation pipeline for Kubernetes manifests:
#   1. YAML Syntax (yamllint) - Foundation, catches malformed YAML
#   2. K8s Schema (kubeconform) - Structure, validates against K8s API schemas
#   3. Kyverno Policies - Policies, enforces organizational standards
#
# Each step depends on the previous one passing (fail-fast).
# --------------------------------------------------------------------------------------------------
name: K8s Manifest Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'k8s/**'
      - 'policies/**'
      - 'tests/policies/**'
      - 'tests/profiles/**'
      - 'scripts/render-profile.sh'
      - 'scripts/render-k8s-for-validation.sh'
      - 'scripts/install-profile-tools.sh'
      - '.github/actions/k8s-schema-validate/**'
      - '.github/actions/kyverno-validate/**'
      - '.github/actions/yaml-lint/**'
      - '.github/workflows/k8s-manifest-validate.yml'
  push:
    branches: [main]
    paths:
      - 'k8s/**'
      - 'policies/**'
      - 'tests/policies/**'
      - 'tests/profiles/**'
      - 'scripts/render-profile.sh'
      - 'scripts/render-k8s-for-validation.sh'
      - 'scripts/install-profile-tools.sh'
      - '.github/actions/k8s-schema-validate/**'
      - '.github/actions/kyverno-validate/**'
      - '.github/actions/yaml-lint/**'
      - '.github/workflows/k8s-manifest-validate.yml'

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Step 1: YAML Syntax Validation
  # Must pass before schema validation can work
  # ---------------------------------------------------------------------------
  yaml-lint:
    name: YAML Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Validate YAML syntax
        uses: ./.github/actions/yaml-lint
        with:
          path: k8s/

  # ---------------------------------------------------------------------------
  # Step 2: Kubernetes Schema Validation
  # Validates structure against K8s API and CRD schemas
  # Only runs if YAML syntax is valid
  # ---------------------------------------------------------------------------
  k8s-schema:
    name: K8s Schema
    needs: yaml-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Validate Kubernetes schemas
        # Render effective profiles rather than validating unresolved bases.
        uses: ./.github/actions/k8s-schema-validate
        with:
          path: k8s/
          kubernetes-version: '1.35.0'

      - name: Verify effective profile contracts
        run: |
          rendered="$RUNNER_TEMP/effective-profiles"
          ./scripts/render-k8s-for-validation.sh "$rendered"
          python -m pip install PyYAML==6.0.3 pytest==8.3.5 --quiet
          FLEET_RENDER_DIR="$rendered" pytest tests/profiles/test_rendered.py -q -p no:cacheprovider

  # ---------------------------------------------------------------------------
  # Step 3: Kyverno Policy Validation
  # Enforces organizational policies (security, standards, best practices)
  # Only runs if schema validation passes
  # ---------------------------------------------------------------------------
  kyverno-policies:
    name: Kyverno Policies
    needs: k8s-schema
    runs-on: ubuntu-latest
    strategy:
      matrix:
        profile: [local, aws-staging]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Validate against Kyverno policies
        uses: ./.github/actions/kyverno-validate
        with:
          profile: ${{ matrix.profile }}

      - name: Test policy regression cases
        run: |
          set -euo pipefail
          /tmp/kyverno test tests/policies 2>&1 | tee "$RUNNER_TEMP/policy-tests.log"
          # The pinned CLI can exit zero on a malformed test definition.
          if grep -q '^Test errors:' "$RUNNER_TEMP/policy-tests.log" ||
             ! grep -Eq '^Test Summary: [1-9][0-9]* tests passed and 0 tests failed$' "$RUNNER_TEMP/policy-tests.log"; then
            echo '::error::Policy tests did not complete successfully.'
            exit 1
          fi
