name: Local Kubernetes

on:
  # Select the candidate branch in the Actions UI, or pass --ref with gh.
  # GITHUB_SHA then binds the deployment record and checkout to that revision.
  workflow_dispatch:
  # The weekly run detects integration drift from upstream charts and images.
  schedule:
    - cron: '37 5 * * 1'
  # A change to what runs on the cluster is proven live before it merges: the
  # merge gate waits for these checks like any other, so unsupervised merges
  # are judged on behaviour, not only on static checks.
  pull_request:
    branches: [main]
    paths:
      - 'k8s/**'
      - 'scripts/**'
      - 'platform/**'
      - 'applications/**'
      - 'tests/profiles/**'
      - 'fleet'
      - '.github/workflows/local-kubernetes.yml'
      # No image or manifest reads Markdown; READMEs and release changelogs
      # under applications/ otherwise start three clusters for prose.
      - '!**/*.md'

permissions:
  contents: read

# Each run owns its kind cluster on its own runner. Per-PR groups keep a
# newer push from leaving an older PR's run cancelled, and supersede only
# the same PR's earlier run.
concurrency:
  group: local-profile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  discover_apps:
    name: Discover application contracts
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.contracts.outputs.apps }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Build the application matrix
        id: contracts
        shell: bash
        run: |
          shopt -s nullglob
          contracts=(k8s/applications/*/fleet-app.yaml)
          if [ "${#contracts[@]}" -lt 2 ]; then
            echo 'At least two application contracts are required.' >&2
            exit 1
          fi
          apps=()
          for contract in "${contracts[@]}"; do
            app="${contract%/fleet-app.yaml}"
            app="${app##*/}"
            if [[ ! "$app" =~ ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$ ]] ||
              ! grep -Eq "^  APP_NAME: $app$" "$contract"; then
              echo "Invalid application contract: $contract" >&2
              exit 1
            fi
            apps+=("$app")
          done
          apps_json="$(printf '%s\n' "${apps[@]}" | jq -Rsc 'split("\n") | map(select(length > 0))')"
          printf 'apps=%s\n' "$apps_json" >> "$GITHUB_OUTPUT"

  acceptance:
    needs: discover_apps
    # Every shipped contract gets its own cluster. Adding an app does not
    # require a second workflow edit that can be forgotten.
    name: Acceptance (${{ matrix.app }})
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.discover_apps.outputs.apps) }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: local
      url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}

      - name: Record deployment scope
        env:
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
          TRIGGER: ${{ github.event_name }}
          APP: ${{ matrix.app }}
        run: |
          {
            echo '### Local profile deployment'
            echo
            printf -- '- Source revision: [`%s`](https://github.com/%s/commit/%s)\n' "$SOURCE_SHA" "$GITHUB_REPOSITORY" "$SOURCE_SHA"
            printf -- '- Ref: `%s`\n' "$SOURCE_REF"
            printf -- '- Trigger: `%s`\n' "$TRIGGER"
            printf -- '- Application: `%s`\n' "$APP"
            echo '- Lifecycle: create, verify, then tear down the ephemeral cluster'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install pinned tools
        run: |
          ./scripts/install-profile-tools.sh "$RUNNER_TEMP/fleet-bin" --local
          echo "$RUNNER_TEMP/fleet-bin" >> "$GITHUB_PATH"

      - name: Select the application
        env:
          APP: ${{ matrix.app }}
        run: |
          scripts/select-app.sh "$APP"
          # The local profile deploys committed revisions only; this commit
          # exists on the runner alone and is never pushed.
          if ! git diff --quiet; then
            git -c user.name='Local acceptance' -c user.email='local-acceptance@example.invalid' \
              commit --quiet -am "chore: run $APP for acceptance"
          fi
          # The cluster runs this revision; it differs from the source revision
          # above when the app selection had to be committed on the runner.
          printf -- '- Tested revision: `%s` (runner-local when it differs from the source)\n' \
            "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Start the local profile
        run: ./fleet up --profile local

      - name: Verify local Kubernetes behaviour
        env:
          # The cluster is deleted next, so a PR skips restoring the original
          # revision (a third canary cycle). Scheduled and manual runs still
          # restore, which keeps that path proven.
          FLEET_TEST_DISPOSABLE: ${{ github.event_name == 'pull_request' && '1' || '' }}
        run: ./fleet test --profile local

      - name: Diagnose failure
        if: failure()
        run: |
          ./fleet status --profile local || true
          kubectl --kubeconfig .git/fleet/local/kubeconfig --context kind-infra-fleet-local get pods -A || true
          kubectl --kubeconfig .git/fleet/local/kubeconfig --context kind-infra-fleet-local describe canaries -n applications || true

      - name: Stop the local profile
        if: always()
        run: ./fleet down --profile local
