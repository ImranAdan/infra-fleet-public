name: Local Kubernetes

on:
  # Select the candidate branch in the Actions UI, or pass --ref with gh.
  # GITHUB_SHA then binds the deployment record and checkout to that revision.
  workflow_dispatch:
  # This confidence run detects integration drift without delaying each PR.
  schedule:
    - cron: '37 5 * * 1'

permissions:
  contents: read

concurrency:
  group: local-profile-deployment
  cancel-in-progress: false

jobs:
  acceptance:
    # The platform names no app, so prove it runs more than one: the same
    # cycle runs with the default app and with podinfo swapped in.
    name: Acceptance (${{ matrix.app }})
    strategy:
      fail-fast: false
      matrix:
        app: [load-harness, podinfo]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: local
      url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}

      - name: Record deployment scope
        env:
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
          TRIGGER: ${{ github.event_name }}
          APP: ${{ matrix.app }}
        run: |
          {
            echo '### Local profile deployment'
            echo
            printf -- '- Revision: [`%s`](https://github.com/%s/commit/%s)\n' "$SOURCE_SHA" "$GITHUB_REPOSITORY" "$SOURCE_SHA"
            printf -- '- Ref: `%s`\n' "$SOURCE_REF"
            printf -- '- Trigger: `%s`\n' "$TRIGGER"
            printf -- '- Application: `%s`\n' "$APP"
            echo '- Lifecycle: create, verify, then tear down the ephemeral cluster'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install pinned tools
        run: |
          ./scripts/install-profile-tools.sh "$RUNNER_TEMP/fleet-bin" --local
          echo "$RUNNER_TEMP/fleet-bin" >> "$GITHUB_PATH"

      - name: Select the application
        env:
          APP: ${{ matrix.app }}
        run: |
          scripts/select-app.sh "$APP"
          # The local profile deploys committed revisions only; this commit
          # exists on the runner alone and is never pushed.
          if ! git diff --quiet; then
            git -c user.name='Local acceptance' -c user.email='local-acceptance@example.invalid' \
              commit --quiet -am "chore: run $APP for acceptance"
          fi
          # The cluster runs this revision; it differs from the source revision
          # above when the app selection had to be committed on the runner.
          printf -- '- Tested revision: `%s` (runner-local when it differs from the source)\n' \
            "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Start the local profile
        run: ./fleet up --profile local

      - name: Verify local Kubernetes behaviour
        run: ./fleet test --profile local

      - name: Diagnose failure
        if: failure()
        run: |
          ./fleet status --profile local || true
          kubectl --kubeconfig .git/fleet/local/kubeconfig --context kind-infra-fleet-local get pods -A || true
          kubectl --kubeconfig .git/fleet/local/kubeconfig --context kind-infra-fleet-local describe canaries -n applications || true

      - name: Stop the local profile
        if: always()
        run: ./fleet down --profile local
