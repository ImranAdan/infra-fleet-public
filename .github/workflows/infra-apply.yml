name: Infra Apply (main)

on:
  push:
    branches: [ main ]
    paths:
      - 'infrastructure/**'
      - '!infrastructure/**/*.md'  # Exclude markdown files

env:
  AWS_REGION: eu-west-2

permissions:
  contents: read

jobs:
  preflight:
    name: Deployment configuration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check deployment settings
        id: check
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
          TF_CLOUD_ORGANIZATION: ${{ secrets.TF_CLOUD_ORGANIZATION }}
        run: |
          set -euo pipefail

          present=0
          missing=""
          for name in AWS_ROLE_ARN TF_API_TOKEN TF_CLOUD_ORGANIZATION; do
            if [ -n "${!name}" ]; then
              present=$((present + 1))
            else
              missing="$missing $name"
            fi
          done

          if [ "$present" -eq 0 ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Deployment skipped"
              echo ""
              echo "This is the expected state for the credentials-free public template."
              echo "Static Terraform validation runs in \`infra-plan.yml\`."
              echo "See \`CONFIGURATION.md\` before enabling deployment in a private copy."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$present" -ne 3 ]; then
            echo "::error::Deployment configuration is partial. See CONFIGURATION.md."
            {
              echo "### Deployment configuration is incomplete"
              echo ""
              echo "Some deployment secrets are present, but these are missing:"
              for name in $missing; do
                case "$name" in
                  AWS_ROLE_ARN) echo "- \`AWS_GITHUB_ACTIONS_ROLE_ARN\`" ;;
                  *) echo "- \`$name\`" ;;
                esac
              done
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "### Deployment configuration is complete" >> "$GITHUB_STEP_SUMMARY"

  detect:
    runs-on: ubuntu-latest
    outputs:
      staging: ${{ steps.detect.outputs.staging-changed }}
      permanent: ${{ steps.detect.outputs.permanent-changed }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Detect changed stacks
        id: detect
        uses: ./.github/actions/detect-terraform-changes
        with:
          base-ref: ${{ github.event.before }}
          head-ref: ${{ github.sha }}

  apply-staging:
    name: Deploy Infrastructure
    needs: [preflight, detect, apply-permanent]
    if: >-
      always() &&
      needs.preflight.outputs.configured == 'true' &&
      needs.detect.outputs.staging == 'true' &&
      (needs.apply-permanent.result == 'success' ||
       needs.apply-permanent.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: staging
      url: https://github.com/${{ github.repository }}/deployments
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup AWS and Terraform
        uses: ./.github/actions/setup-aws-terraform
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          session-name: GitHubActions-Apply
          tf-api-token: ${{ secrets.TF_API_TOKEN }}
          tf-cloud-organization: ${{ secrets.TF_CLOUD_ORGANIZATION }}
          tf-workspace: ${{ vars.TF_WORKSPACE_STAGING || 'infra-fleet-staging' }}

      - name: Terraform fmt (check)
        run: terraform -chdir=infrastructure/staging fmt -check

      - name: Terraform init
        run: |
          UPGRADE_FLAG=""
          if [[ "$COMMIT_MESSAGE" == deps:* ]] || [[ "$COMMIT_MESSAGE" == *"dependabot"* ]]; then
            UPGRADE_FLAG="-upgrade"
          fi
          terraform -chdir=infrastructure/staging init -input=false $UPGRADE_FLAG
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}

      - name: Terraform plan (staging)
        run: terraform -chdir=infrastructure/staging plan -input=false
        env:
          TF_VAR_eks_admin_principal_arns: ${{ vars.EKS_ADMIN_PRINCIPAL_ARNS_JSON || '[]' }}

      - name: Terraform apply (staging)
        run: terraform -chdir=infrastructure/staging apply -input=false -auto-approve
        env:
          TF_VAR_eks_admin_principal_arns: ${{ vars.EKS_ADMIN_PRINCIPAL_ARNS_JSON || '[]' }}

  apply-permanent:
    needs: [preflight, detect]
    if: needs.preflight.outputs.configured == 'true' && needs.detect.outputs.permanent == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup AWS and Terraform
        uses: ./.github/actions/setup-aws-terraform
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          session-name: GitHubActions-Apply
          tf-api-token: ${{ secrets.TF_API_TOKEN }}
          tf-cloud-organization: ${{ secrets.TF_CLOUD_ORGANIZATION }}
          tf-workspace: ${{ vars.TF_WORKSPACE_PERMANENT || 'infra-fleet-permanent' }}

      - name: Terraform fmt (check)
        run: terraform -chdir=infrastructure/permanent fmt -check

      - name: Terraform init
        run: |
          UPGRADE_FLAG=""
          if [[ "$COMMIT_MESSAGE" == deps:* ]] || [[ "$COMMIT_MESSAGE" == *"dependabot"* ]]; then
            UPGRADE_FLAG="-upgrade"
          fi
          terraform -chdir=infrastructure/permanent init -input=false $UPGRADE_FLAG
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}

      - name: Terraform plan (permanent)
        run: terraform -chdir=infrastructure/permanent plan -input=false
        env:
          TF_VAR_github_repository: ${{ github.repository }}

      - name: Terraform apply (permanent)
        run: terraform -chdir=infrastructure/permanent apply -input=false -auto-approve
        env:
          TF_VAR_github_repository: ${{ github.repository }}
