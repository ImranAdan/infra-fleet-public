name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    env:
      # secrets cannot be referenced directly in a step-level `if`, so surface
      # their presence as a job-level env value instead.
      HAS_APP_CREDENTIALS: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID != '' && secrets.RELEASE_PLEASE_APP_PRIVATE_KEY != '' }}
    steps:
      # A GitHub App installation token, unlike GITHUB_TOKEN, triggers other
      # workflows. Without it the tag release-please pushes does not start
      # Load Harness CI, and the release pull request does not trigger the
      # normal pull_request checks.
      #
      # Optional on purpose: if the App secrets are absent this step is
      # skipped and the job falls back to GITHUB_TOKEN, which works for
      # creating the release PR and tag. Adding the secrets upgrades the
      # behaviour with no further change to this file.
      - name: Mint GitHub App token
        id: app-token
        if: env.HAS_APP_CREDENTIALS == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Prefer the short-lived App installation token, then fall back to
          # the job's own GITHUB_TOKEN for a manual release path.
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
