name: Infrastructure Validation

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'infrastructure/**'
      - '!infrastructure/**/*.md'  # Exclude markdown files
  push:
    branches: [ main ]
    paths:
      - 'infrastructure/**'
      - '!infrastructure/**/*.md'

permissions:
  contents: read

jobs:
  validate:
    name: Infrastructure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Scan staging configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 'v0.74.0'
          scan-type: 'config'
          scan-ref: 'infrastructure/staging'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          trivyignores: 'infrastructure/staging/.trivyignore'
          skip-dirs: '.terraform'
          hide-progress: true
        env:
          TRIVY_QUIET: true

      - name: Scan permanent configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 'v0.74.0'
          scan-type: 'config'
          scan-ref: 'infrastructure/permanent'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          skip-dirs: '.terraform'
          hide-progress: true
        env:
          TRIVY_QUIET: true

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.14.0'

      - name: Format, initialize and validate both roots
        run: |
          set -euo pipefail
          for root in staging permanent; do
            terraform -chdir="infrastructure/$root" fmt -check
            terraform -chdir="infrastructure/$root" init -backend=false -input=false
            terraform -chdir="infrastructure/$root" validate
          done
