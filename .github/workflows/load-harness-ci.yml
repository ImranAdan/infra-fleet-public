name: Load Harness CI

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'applications/load-harness/src/**'
      - 'applications/load-harness/tests/**'
      - 'applications/load-harness/Dockerfile'
      - 'applications/load-harness/.dockerignore'
      - 'applications/load-harness/requirements.txt'
      - 'applications/load-harness/ci/**'
      - '.release-please-manifest.json'
      - '.github/workflows/load-harness-ci.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      package_image:
        description: 'Save the validated image for a caller that will publish it'
        required: false
        default: false
        type: boolean
    outputs:
      image_tag:
        description: Validated immutable image tag
        value: ${{ jobs.validate.outputs.image_tag }}

permissions:
  contents: read

defaults:
  run:
    working-directory: applications/load-harness

env:
  AWS_REGION: eu-west-2
  ECR_REPOSITORY: load-harness

jobs:
  validate:
    name: Application
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.image.outputs.image_tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Set PYTHONPATH
        run: |
          echo "PYTHONPATH=$PYTHONPATH:$PWD/src" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: |
          pytest tests/ -v -W error::DeprecationWarning

      - name: Test image tag selection
        run: ./ci/test-image-tag.sh

      - name: Set image tag
        id: image
        run: |
          set -euo pipefail
          image_tag=$(./ci/image-tag.sh)
          echo "IMAGE_TAG=$image_tag" >> "$GITHUB_ENV"
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"
          echo "Building image: $image_tag"
        env:
          PUBLISH_TO_ECR: ${{ inputs.package_image || false }}

      - name: Build Docker image
        run: |
          set -euo pipefail
          docker build \
            --build-arg "APP_VERSION=$IMAGE_TAG" \
            -t "$ECR_REPOSITORY:$IMAGE_TAG" .
          echo "✅ Image built: $ECR_REPOSITORY:$IMAGE_TAG (version: $IMAGE_TAG)"

      - name: Test Docker container
        run: |
          set -euo pipefail
          container_name="load-harness-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm --force "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          # API_KEY is required whenever ENVIRONMENT is not "local": the app
          # refuses to start rather than serve every load endpoint openly. Pass
          # one here so the smoke test exercises the configuration that ships,
          # authentication included, instead of an open one that never does.
          docker run -d --name "$container_name" \
            -p 8080:8080 \
            -e PORT=8080 \
            -e ENVIRONMENT=ci \
            -e API_KEY=ci-smoke-test-key \
            -e SECRET_KEY=ci-smoke-test-session-key \
            -e "APP_VERSION=$IMAGE_TAG" \
            "$ECR_REPOSITORY:$IMAGE_TAG"

          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://localhost:8080/ready >/dev/null; then
              ready=true
              break
            fi
            if ! docker inspect --format '{{.State.Running}}' "$container_name" | grep -qx true; then
              echo "Container exited before becoming ready." >&2
              docker logs "$container_name"
              exit 1
            fi
            echo "Waiting for readiness (attempt $attempt/30)..."
            sleep 2
          done

          if [ "$ready" != true ]; then
            echo "Container did not become ready within 60 seconds." >&2
            docker logs "$container_name"
            exit 1
          fi

          # Test endpoints
          echo "Testing /health endpoint..."
          curl -f http://localhost:8080/health

          echo "Testing root endpoint..."
          curl -f http://localhost:8080/

          echo "Testing /metrics endpoint..."
          curl -f http://localhost:8080/metrics

          echo "✅ All endpoints responding"

      - name: Security scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 'v0.74.0'
          image-ref: ${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table
          ignore-unfixed: true

      - name: Save image artifact
        if: inputs.package_image == true
        run: |
          set -euo pipefail
          docker save "$ECR_REPOSITORY:$IMAGE_TAG" | gzip > /tmp/image.tar.gz

      - name: Upload image artifact
        if: inputs.package_image == true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: docker-image
          path: /tmp/image.tar.gz
          retention-days: 1
