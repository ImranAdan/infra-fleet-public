name: Load Harness CI

on:
  push:
    tags: [ 'v*' ]
    # Only push to ECR on release tags
    # Aligns with Flux ImagePolicy semver range and release-please workflow
  pull_request:
    branches: [ main ]
    paths:
      - 'applications/load-harness/src/**'
      - 'applications/load-harness/tests/**'
      - 'applications/load-harness/Dockerfile'
      - 'applications/load-harness/requirements.txt'
      - '.github/workflows/load-harness-ci.yml'
  workflow_dispatch:
    inputs:
      publish_to_ecr:
        description: 'Publish the validated image to the configured ECR repository'
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      publish_to_ecr:
        description: 'Publish the validated image to the configured ECR repository'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

defaults:
  run:
    working-directory: applications/load-harness

env:
  AWS_REGION: eu-west-2
  ECR_REPOSITORY: load-harness

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Set PYTHONPATH
        run: |
          echo "PYTHONPATH=$PYTHONPATH:$PWD/src" >> $GITHUB_ENV

      - name: Run unit tests
        run: |
          pytest tests/ -v -W error::DeprecationWarning

  docker-build:
    name: Build & Test Container
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image_tag: ${{ steps.image.outputs.image_tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set image tag
        id: image
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            image_tag="${GITHUB_REF_NAME}"
            if [[ ! "$image_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Release tags must use vMAJOR.MINOR.PATCH format." >&2
              exit 1
            fi
          elif [ "${PUBLISH_TO_ECR}" = "true" ]; then
            version=$(jq -er '.\"applications/load-harness\"' ../../.release-please-manifest.json)
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid load-harness version in .release-please-manifest.json" >&2
              exit 1
            fi
            image_tag="v$version"
          else
            image_tag="pr-${GITHUB_SHA:0:8}"
          fi

          if [[ ! "$image_tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Generated image tag is not valid for a container registry." >&2
            exit 1
          fi

          echo "IMAGE_TAG=$image_tag" >> "$GITHUB_ENV"
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"
          echo "Building image: $image_tag"
        env:
          PUBLISH_TO_ECR: ${{ inputs.publish_to_ecr || false }}

      - name: Build Docker image
        run: |
          set -euo pipefail
          docker build \
            --build-arg "APP_VERSION=$IMAGE_TAG" \
            -t "$ECR_REPOSITORY:$IMAGE_TAG" .
          echo "✅ Image built: $ECR_REPOSITORY:$IMAGE_TAG (version: $IMAGE_TAG)"

      - name: Test Docker container
        run: |
          set -euo pipefail
          container_name="load-harness-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm --force "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d --name "$container_name" \
            -p 8080:8080 \
            -e PORT=8080 \
            -e ENVIRONMENT=ci \
            -e "APP_VERSION=$IMAGE_TAG" \
            "$ECR_REPOSITORY:$IMAGE_TAG"

          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://localhost:8080/ready >/dev/null; then
              ready=true
              break
            fi
            if ! docker inspect --format '{{.State.Running}}' "$container_name" | grep -qx true; then
              echo "Container exited before becoming ready." >&2
              docker logs "$container_name"
              exit 1
            fi
            echo "Waiting for readiness (attempt $attempt/30)..."
            sleep 2
          done

          if [ "$ready" != true ]; then
            echo "Container did not become ready within 60 seconds." >&2
            docker logs "$container_name"
            exit 1
          fi

          # Test endpoints
          echo "Testing /health endpoint..."
          curl -f http://localhost:8080/health

          echo "Testing root endpoint..."
          curl -f http://localhost:8080/

          echo "Testing /metrics endpoint..."
          curl -f http://localhost:8080/metrics

          echo "✅ All endpoints responding"

      - name: Save image artifact
        run: |
          set -euo pipefail
          docker save "$ECR_REPOSITORY:$IMAGE_TAG" | gzip > /tmp/image.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: docker-image
          path: /tmp/image.tar.gz
          retention-days: 1

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: docker-build
    defaults:
      run:
        working-directory: .
    env:
      IMAGE_TAG: ${{ needs.docker-build.outputs.image_tag }}
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: |
          docker load < /tmp/image.tar.gz

      - name: Security scan (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 'v0.68.1'
          image-ref: ${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table
          ignore-unfixed: true

  publish-configuration:
    name: ECR configuration
    runs-on: ubuntu-latest
    needs: security-scan
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_to_ecr == true
    permissions:
      contents: read
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check AWS role
        id: check
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          PUBLISH_TO_ECR: ${{ inputs.publish_to_ecr || false }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          if [ "$PUBLISH_TO_ECR" = "true" ] &&
             [[ "$SOURCE_REF" != refs/tags/v* ]] &&
             [ "$SOURCE_REF" != "refs/heads/main" ]; then
            echo "::error::Manual ECR publishing is allowed only from main."
            exit 1
          fi

          if [ -z "$AWS_ROLE_ARN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### ECR publish skipped"
              echo ""
              echo "The image was built and scanned, but this credentials-free template has no AWS role."
              echo "A configured private copy publishes release tags to ECR."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

  push-to-ecr:
    name: Push to ECR
    runs-on: ubuntu-latest
    needs: [docker-build, security-scan, publish-configuration]
    if: >-
      (startsWith(github.ref, 'refs/tags/v') || inputs.publish_to_ecr == true) &&
      needs.publish-configuration.outputs.configured == 'true'
    environment:
      name: staging
      url: https://github.com/${{ github.repository }}/deployments
    defaults:
      run:
        working-directory: .
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE_TAG: ${{ needs.docker-build.outputs.image_tag }}
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: |
          docker load < /tmp/image.tar.gz

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Push image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY"

          if aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "Image already exists and ECR tags are immutable: $IMAGE_URI:$IMAGE_TAG"
            exit 0
          fi

          echo "Tagging and pushing release image..."
          docker tag "$ECR_REPOSITORY:$IMAGE_TAG" "$IMAGE_URI:$IMAGE_TAG"
          docker push "$IMAGE_URI:$IMAGE_TAG"

          echo "✅ Pushed $IMAGE_URI:$IMAGE_TAG"

          echo "image_uri=$IMAGE_URI:$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

# NOTE: Manifest updates are now handled by Flux Image Automation
# The image-automation-controller detects new ECR images and commits
# manifest updates automatically, eliminating CI race conditions.
#
# Old update-manifest job removed - CI now only builds and pushes images.
# Flux handles: ECR scan -> ImagePolicy selection -> Git commit -> Cluster sync
