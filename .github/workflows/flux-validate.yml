name: Flux Reconciliation Validation

on:
  workflow_dispatch:
    inputs:
      bake_time_seconds:
        description: 'Bake time before checking (seconds)'
        required: false
        default: '180'
        type: string
  workflow_call:
    inputs:
      bake_time_seconds:
        description: 'Bake time before checking (seconds)'
        type: string
        required: false
        default: '180'
      expected_revision:
        description: 'Expected Git revision (SHA) to verify'
        type: string
        required: false

permissions:
  contents: read

env:
  AWS_REGION: eu-west-2

jobs:
  verify-flux:
    name: Verify Flux Reconciliation
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      status: ${{ steps.flux-verify.outputs.status }}
      kustomizations_ready: ${{ steps.flux-verify.outputs.kustomizations_ready }}
      git_revision: ${{ steps.flux-verify.outputs.git_revision }}

    steps:
      - name: Verify workflow configuration
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          REQUEST_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$REQUEST_REF" != "refs/heads/main" ]; then
            echo "::error::Flux verification must run from main."
            exit 1
          fi
          if [ -z "$AWS_ROLE_ARN" ]; then
            echo "::error::AWS_GITHUB_ACTIONS_ROLE_ARN is not configured. See CONFIGURATION.md."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          role-session-name: GitHubActions-FluxValidate-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify Flux Reconciliation
        id: flux-verify
        uses: ./.github/actions/verify-flux-reconciliation
        with:
          cluster_name: staging
          aws_region: ${{ env.AWS_REGION }}
          bake_time_seconds: ${{ inputs.bake_time_seconds || '180' }}
          expected_revision: ${{ inputs.expected_revision || '' }}

      - name: Report Status
        if: always()
        env:
          STATUS: ${{ steps.flux-verify.outputs.status }}
          KUSTOMIZATIONS_READY: ${{ steps.flux-verify.outputs.kustomizations_ready }}
          GIT_REVISION: ${{ steps.flux-verify.outputs.git_revision }}
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "FLUX VALIDATION SUMMARY"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "Status: $STATUS"
          echo "Kustomizations Ready: $KUSTOMIZATIONS_READY"
          echo "Git Revision: $GIT_REVISION"
          echo ""

          if [ "$STATUS" = "success" ]; then
            echo "Flux reconciliation verified successfully!"
          elif [ "$STATUS" = "cluster_unavailable" ]; then
            echo "Cluster not available - cannot verify Flux reconciliation"
            exit 1
          else
            echo "Flux reconciliation verification failed"
            exit 1
          fi
