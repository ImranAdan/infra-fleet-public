version: 2

updates:
  # Python dependencies - monthly, grouped
  - package-ecosystem: "pip"
    directory: "/applications/load-harness"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "deps"
    groups:
      python-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 3

  # Tailwind CSS build tool - monthly. Build-time only: after a bump, run
  # `npm run build:css` and commit static/css/app.css. Major versions are
  # ignored: Tailwind 4 replaces tailwind.config.js and the build command.
  - package-ecosystem: "npm"
    directory: "/applications/load-harness"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "deps"
    ignore:
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]

  # Docker base images - monthly
  - package-ecosystem: "docker"
    directory: "/applications/load-harness"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "deps"
    ignore:
      - dependency-name: "python"
        versions: [">=3.14"]

  # podinfo, the second app: its pinned upstream image
  - package-ecosystem: "docker"
    directory: "/applications/podinfo"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "deps"

  # Fleet Runner, the game: the same pinned Python base as load-harness
  - package-ecosystem: "docker"
    directory: "/applications/mario-game"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "deps"
    ignore:
      - dependency-name: "python"
        versions: [">=3.14"]

  # GitHub Actions - monthly and grouped across workflows and composite actions.
  # Major updates are included: immutable SHA pins and the ordinary Fleet gates
  # make them reviewable without leaving old action runtimes in the template.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        # Move one action atomically across workflows and composite actions.
        # Different actions may produce separate PRs, but the limit below
        # serializes them so CI never receives a dependency-update burst.
        group-by: dependency-name
    open-pull-requests-limit: 1

  # Terraform providers - monthly, grouped
  - package-ecosystem: "terraform"
    directory: "/infrastructure/staging"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "deps"
    groups:
      terraform-staging:
        patterns:
          - "*"

  - package-ecosystem: "terraform"
    directory: "/infrastructure/permanent"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "deps"
    groups:
      terraform-permanent:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "deps"
    groups:
      development-tools:
        patterns:
          - "*"

  # The shared Mandate decision engine. It has no runtime dependencies today;
  # this entry keeps its build requirements under the same update policy.
  - package-ecosystem: "pip"
    directory: "/mandate"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "deps"
    groups:
      mandate:
        patterns:
          - "*"

  # The merge gate's workflow parser, which the merge worker installs with
  # hashes; a bump must update the hashes in the same PR.
  - package-ecosystem: "pip"
    directory: "/.claude/skills/merge-gate"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "deps"

  # The local Git server image is pinned by digest; Dependabot refreshes the
  # base image. Its apk package pins track that base and must be bumped in the
  # same PR; the Template Contract workflow builds the image to catch a miss.
  - package-ecosystem: "docker"
    directory: "/platform/local/git-server"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "deps"
