version: 2

updates:
  # Python dependencies - monthly, grouped
  - package-ecosystem: "pip"
    directory: "/applications/load-harness"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "deps"
    groups:
      python-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 3

  # Docker base images - monthly
  - package-ecosystem: "docker"
    directory: "/applications/load-harness"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "deps"
    ignore:
      - dependency-name: "python"
        versions: [">=3.14"]

  # GitHub Actions - monthly, grouped, no major bumps
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      github-actions:
        patterns:
          - "*"

  # Terraform providers - monthly, grouped
  - package-ecosystem: "terraform"
    directory: "/infrastructure/staging"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "deps"
    groups:
      terraform-staging:
        patterns:
          - "*"

  - package-ecosystem: "terraform"
    directory: "/infrastructure/permanent"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "deps"
    groups:
      terraform-permanent:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "deps"
    groups:
      development-tools:
        patterns:
          - "*"

  # The local Git server image is pinned by digest; Dependabot refreshes the
  # base image. Its apk package pins track that base and are bumped with it.
  - package-ecosystem: "docker"
    directory: "/platform/local/git-server"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "deps"
