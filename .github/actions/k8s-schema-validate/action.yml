# --------------------------------------------------------------------------------------------------
# Kubernetes Schema Validation Composite Action
# Validates Kubernetes manifests against schemas using kubeconform.
# Supports both core Kubernetes resources and CRDs (Flux, Prometheus, etc.).
# --------------------------------------------------------------------------------------------------
name: 'Kubernetes Schema Validate'
description: 'Validate Kubernetes manifests against schemas using kubeconform'

inputs:
  path:
    description: 'Path to directory containing Kubernetes manifests'
    required: true
    default: 'k8s/'
  kubernetes-version:
    description: 'Kubernetes version for schema validation'
    required: false
    default: '1.35.0'

runs:
  using: 'composite'
  steps:
    - name: Install kubeconform
      shell: bash
      run: |
        set -euo pipefail
        KUBECONFORM_VERSION="0.6.4"
        curl --fail --silent --show-error --location \
          --output /tmp/kubeconform.tar.gz \
          "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
        echo "2b4ebeaa4d5ac4843cf8f7b7e66a8874252b6b71bc7cbfc4ef1cbf85acec7c07  /tmp/kubeconform.tar.gz" | sha256sum --check
        tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform

    - name: Validate Kubernetes schemas
      shell: bash
      env:
        KUBERNETES_VERSION: ${{ inputs.kubernetes-version }}
      run: |
        set -euo pipefail
        if [[ ! "$KUBERNETES_VERSION" =~ ^1\.[0-9]+\.[0-9]+$ ]]; then
          echo "Invalid Kubernetes version: $KUBERNETES_VERSION" >&2
          exit 2
        fi
        rendered_path=$(mktemp -d)/k8s
        ./scripts/render-k8s-for-validation.sh "$rendered_path"
        echo "Validating Kubernetes manifests against v$KUBERNETES_VERSION schemas..."
        /tmp/kubeconform \
          -strict \
          -summary \
          -kubernetes-version "$KUBERNETES_VERSION" \
          -schema-location default \
          -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/ad3b08c5045129d7bb1eeffd8e61719b2c8dd1e2/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
          -ignore-missing-schemas \
          "$rendered_path"
        echo "Kubernetes schema validation passed"
