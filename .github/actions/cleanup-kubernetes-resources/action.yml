name: 'Cleanup Kubernetes Resources'
description: 'Suspends Flux and removes Kubernetes-managed cloud resources'

inputs:
  cluster-name:
    description: 'EKS cluster name'
    required: false
    default: 'staging'
  aws-region:
    description: 'AWS region'
    required: false
    default: 'eu-west-2'
  mode:
    description: 'Cleanup mode: dry-run or live'
    required: false
    default: 'dry-run'
  run-verification:
    description: 'Run pre/post verification scripts'
    required: false
    default: 'true'

outputs:
  status:
    description: 'Cleanup status: success, failed, or skipped'
    value: ${{ steps.cleanup.outputs.status }}

runs:
  using: 'composite'
  steps:
    - name: Pre-cleanup verification
      if: inputs.run-verification == 'true'
      shell: bash
      env:
        CLUSTER_NAME: ${{ inputs.cluster-name }}
        AWS_REGION_NAME: ${{ inputs.aws-region }}
      run: |
        set -euo pipefail
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "PRE-CLEANUP STATE"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        if [ -f scripts/verify-cleanup-resources.sh ]; then
          chmod +x scripts/verify-cleanup-resources.sh
          ./scripts/verify-cleanup-resources.sh "$CLUSTER_NAME" "$AWS_REGION_NAME" || true
        else
          echo "Verification script not found, skipping..."
        fi

    - name: Run cleanup script
      id: cleanup
      shell: bash
      env:
        CLUSTER_NAME: ${{ inputs.cluster-name }}
        AWS_REGION_NAME: ${{ inputs.aws-region }}
        CLEANUP_MODE: ${{ inputs.mode }}
      run: |
        set -euo pipefail
        if [[ ! "$CLUSTER_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9_-]*$ ]] ||
           [[ ! "$AWS_REGION_NAME" =~ ^[a-z]{2}(-gov)?-[a-z]+-[0-9]+$ ]]; then
          echo "Invalid EKS cluster name or AWS region." >&2
          exit 2
        fi
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "RUNNING CLEANUP (mode: $CLEANUP_MODE)"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

        if [ ! -f scripts/cleanup-k8s-resources-v2.sh ]; then
          echo "Cleanup script not found, skipping..."
          echo "status=skipped" >> $GITHUB_OUTPUT
          exit 0
        fi

        chmod +x scripts/cleanup-k8s-resources-v2.sh

        case "$CLEANUP_MODE" in
          dry-run)
            ./scripts/cleanup-k8s-resources-v2.sh "$CLUSTER_NAME" "$AWS_REGION_NAME" dry-run
            ;;
          live)
            ./scripts/cleanup-k8s-resources-v2.sh "$CLUSTER_NAME" "$AWS_REGION_NAME"
            ;;
          *)
            echo "Unsupported cleanup mode: $CLEANUP_MODE" >&2
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 2
            ;;
        esac
        echo "status=success" >> "$GITHUB_OUTPUT"

    - name: Post-cleanup verification
      if: inputs.run-verification == 'true'
      shell: bash
      env:
        CLUSTER_NAME: ${{ inputs.cluster-name }}
        AWS_REGION_NAME: ${{ inputs.aws-region }}
      run: |
        set -euo pipefail
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "POST-CLEANUP STATE"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        if [ -f scripts/verify-cleanup-resources.sh ]; then
          chmod +x scripts/verify-cleanup-resources.sh
          ./scripts/verify-cleanup-resources.sh "$CLUSTER_NAME" "$AWS_REGION_NAME" || true
        fi
