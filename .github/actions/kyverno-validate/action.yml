name: Kyverno Policy Validate
description: Validate the effective deployment profile against its selected policies

inputs:
  profile:
    description: Deployment profile
    required: true
    default: aws-staging

runs:
  using: composite
  steps:
    - name: Install pinned renderer
      shell: bash
      run: |
        ./scripts/install-profile-tools.sh "$RUNNER_TEMP/fleet-bin"
        echo "$RUNNER_TEMP/fleet-bin" >> "$GITHUB_PATH"

    - name: Install Kyverno CLI
      shell: bash
      run: |
        set -euo pipefail
        curl -fsSL --retry 3 -o /tmp/kyverno.tar.gz \
          https://github.com/kyverno/kyverno/releases/download/v1.13.4/kyverno-cli_v1.13.4_linux_x86_64.tar.gz
        echo "abd318dbb971ab6de2bbe3b7226f4a03230d5c9c651df8a29b6b5e085a55aeeb  /tmp/kyverno.tar.gz" | sha256sum --check
        tar -xzf /tmp/kyverno.tar.gz -C /tmp kyverno

    - name: Validate selected policies
      shell: bash
      env:
        PROFILE: ${{ inputs.profile }}
      run: |
        set -euo pipefail
        case "$PROFILE" in local|aws-staging) ;; *) echo 'Unsupported profile' >&2; exit 2 ;; esac
        rendered=$(mktemp -d)
        kubectl kustomize "k8s/profiles/$PROFILE/policies" > "$rendered/policies.yaml"
        ./scripts/render-profile.sh "$PROFILE" > "$rendered/resources.yaml"
        /tmp/kyverno apply "$rendered/policies.yaml" --resource "$rendered/resources.yaml" --table
