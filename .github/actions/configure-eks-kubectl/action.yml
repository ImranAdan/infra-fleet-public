name: 'Configure EKS kubectl'
description: 'Configures kubectl for EKS cluster access'

inputs:
  cluster-name:
    description: 'EKS cluster name'
    required: false
    default: 'staging'
  aws-region:
    description: 'AWS region'
    required: false
    default: 'eu-west-2'

outputs:
  cluster-endpoint:
    description: 'EKS cluster API endpoint'
    value: ${{ steps.config.outputs.cluster-endpoint }}

runs:
  using: 'composite'
  steps:
    - name: Configure kubectl
      id: config
      shell: bash
      env:
        CLUSTER_NAME: ${{ inputs.cluster-name }}
        AWS_REGION_NAME: ${{ inputs.aws-region }}
      run: |
        set -euo pipefail
        if [[ ! "$CLUSTER_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9_-]*$ ]] ||
           [[ ! "$AWS_REGION_NAME" =~ ^[a-z]{2}(-gov)?-[a-z]+-[0-9]+$ ]]; then
          echo "Invalid EKS cluster name or AWS region." >&2
          exit 2
        fi

        echo "Configuring kubectl for cluster: $CLUSTER_NAME"
        aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION_NAME"

        # Get cluster endpoint for output
        ENDPOINT=$(aws eks describe-cluster --name "$CLUSTER_NAME" --region "$AWS_REGION_NAME" --query 'cluster.endpoint' --output text)
        echo "cluster-endpoint=$ENDPOINT" >> "$GITHUB_OUTPUT"

        echo "kubectl configured successfully"
        kubectl cluster-info
