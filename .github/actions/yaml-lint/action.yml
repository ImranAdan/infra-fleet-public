# --------------------------------------------------------------------------------------------------
# YAML Lint Composite Action
# Validates YAML syntax using yamllint with a relaxed configuration suitable for Kubernetes manifests.
# --------------------------------------------------------------------------------------------------
name: 'YAML Lint'
description: 'Validate YAML syntax in the specified directory'

inputs:
  path:
    description: 'Path to directory containing YAML files'
    required: true
    default: 'k8s/'

runs:
  using: 'composite'
  steps:
    - name: Install yamllint
      shell: bash
      run: pip install yamllint==1.37.1 --quiet

    - name: Create yamllint config
      shell: bash
      run: |
        cat > /tmp/yamllint-config.yml <<EOF
        extends: relaxed
        rules:
          line-length: disable
          trailing-spaces: disable
          indentation: disable
          document-start: disable
        EOF

    - name: Run yamllint
      shell: bash
      env:
        YAML_PATH: ${{ inputs.path }}
      run: |
        set -euo pipefail
        if [[ "$YAML_PATH" = /* ]] || [[ "$YAML_PATH" == *..* ]] || [ ! -e "$YAML_PATH" ]; then
          echo "Invalid YAML validation path: $YAML_PATH" >&2
          exit 2
        fi
        echo "Validating YAML syntax in $YAML_PATH..."
        yamllint -c /tmp/yamllint-config.yml "$YAML_PATH"
        echo "YAML syntax validation passed"
