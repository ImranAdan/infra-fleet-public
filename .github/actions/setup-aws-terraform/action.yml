name: 'Setup AWS and Terraform'
description: 'Configures AWS credentials via OIDC and installs Terraform'

inputs:
  role-to-assume:
    description: 'AWS IAM role ARN to assume via OIDC'
    required: true
  aws-region:
    description: 'AWS region'
    required: false
    default: 'eu-west-2'
  session-name:
    description: 'AWS session name suffix (e.g., Apply, Plan, Destroy)'
    required: false
    default: 'GitHubActions'
  terraform-version:
    description: 'Terraform version to install'
    required: false
    default: '1.14.0'
  tf-cloud-organization:
    description: 'HCP Terraform organization. Sets TF_CLOUD_ORGANIZATION for the cloud block'
    required: true
  tf-workspace:
    description: 'HCP Terraform workspace for this stack. Sets TF_WORKSPACE'
    required: true
  tf-api-token:
    description: 'Terraform Cloud API token'
    required: true

runs:
  using: 'composite'
  steps:

    - name: Configure HCP Terraform target
      shell: bash
      env:
        TF_CLOUD_ORG: ${{ inputs.tf-cloud-organization }}
        TF_WS: ${{ inputs.tf-workspace }}
      run: |
        # The cloud {} block in main.tf is intentionally empty; organization
        # and workspace are supplied here so no .tf file names them.
        if [ -z "$TF_CLOUD_ORG" ]; then
          echo "::error::TF_CLOUD_ORGANIZATION is not set. Terraform cannot resolve the HCP Terraform organization. See CONFIGURATION.md."
          exit 1
        fi
        if [ -z "$TF_WS" ]; then
          echo "::error::No HCP Terraform workspace supplied for this stack. See CONFIGURATION.md."
          exit 1
        fi
        echo "TF_CLOUD_ORGANIZATION=$TF_CLOUD_ORG" >> "$GITHUB_ENV"
        echo "TF_WORKSPACE=$TF_WS" >> "$GITHUB_ENV"
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ inputs.terraform-version }}
        cli_config_credentials_token: ${{ inputs.tf-api-token }}

    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        role-session-name: ${{ inputs.session-name }}-${{ github.run_id }}
        aws-region: ${{ inputs.aws-region }}

    - name: Verify setup
      shell: bash
      run: |
        echo "Terraform version:"
        terraform --version
        echo ""
        echo "AWS identity:"
        aws sts get-caller-identity
