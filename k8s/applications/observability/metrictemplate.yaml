# Canary analysis measures the app at the gateway, so any HTTP app can be
# analysed without exporting its own metrics.
# ponytail: Envoy Gateway keeps primary and canary endpoints in one cluster per
# route rule, so these are route-wide; a failing canary still breaks the gates
# because its share of traffic fails. Per-backend stats need an EnvoyProxy
# telemetry change if the gates ever need canary-only precision.
apiVersion: flagger.app/v1beta1
kind: MetricTemplate
metadata:
  name: request-success-rate
  namespace: applications
spec:
  provider:
    type: prometheus
    address: http://kube-prometheus-stack-prometheus.observability:9090
  query: |
    sum(rate(envoy_cluster_upstream_rq{envoy_cluster_name=~"httproute/{{ namespace }}/{{ target }}/rule/.*",envoy_response_code!~"5.."}[{{ interval }}]))
    / sum(rate(envoy_cluster_upstream_rq{envoy_cluster_name=~"httproute/{{ namespace }}/{{ target }}/rule/.*"}[{{ interval }}])) * 100
---
apiVersion: flagger.app/v1beta1
kind: MetricTemplate
metadata:
  name: request-duration
  namespace: applications
spec:
  provider:
    type: prometheus
    address: http://kube-prometheus-stack-prometheus.observability:9090
  # Envoy records upstream time in milliseconds.
  query: |
    histogram_quantile(0.99, sum(rate(envoy_cluster_upstream_rq_time_bucket{envoy_cluster_name=~"httproute/{{ namespace }}/{{ target }}/rule/.*"}[{{ interval }}])) by (le))
