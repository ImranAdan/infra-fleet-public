apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: load-harness
  namespace: applications
spec:
  selector:
    matchExpressions:
      - key: app
        operator: In
        values: [load-harness, load-harness-primary]
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 15s
      # The dashboards select job="load-harness", as local-dev Prometheus does.
      # Without this the operator names the job "applications/load-harness".
      relabelings:
        - targetLabel: job
          replacement: load-harness
