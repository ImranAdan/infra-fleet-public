apiVersion: flagger.app/v1beta1
kind: Canary
metadata:
  name: load-harness
  namespace: applications
spec:
  provider: ${TRAFFIC_PROVIDER}
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: load-harness
  autoscalerRef:
    apiVersion: autoscaling/v2
    kind: HorizontalPodAutoscaler
    name: load-harness
  service:
    port: 5000
    targetPort: 5000
  analysis:
    interval: 30s
    maxWeight: 50
    stepWeight: 10
    threshold: 3
    metrics:
      # Reserved Flagger metric names invoke provider-specific built-ins before
      # a template. These distinct names always evaluate the selected profile's
      # explicit MetricTemplate.
      - name: workload-request-success-rate
        templateRef:
          name: request-success-rate
          namespace: applications
        thresholdRange:
          min: 99
        interval: 1m
      - name: workload-request-duration
        templateRef:
          name: request-duration
          namespace: applications
        thresholdRange:
          max: 500
        interval: 1m
    webhooks:
      - name: smoke-test
        type: pre-rollout
        url: http://flagger-loadtester.flux-system/
        timeout: 30s
        metadata:
          type: cmd
          cmd: "hey -z 5s -q 5 -c 2 http://load-harness-canary.applications:5000/health"
      - name: load-test
        type: rollout
        url: http://flagger-loadtester.flux-system/
        timeout: 15s
        metadata:
          type: cmd
          # This public endpoint participates in chaos injection; probes do not.
          cmd: "hey -z 10s -q 10 -c 2 -H 'Host: ${APP_HOSTNAME}' http://${TRAFFIC_ENDPOINT}/apispec.json"
