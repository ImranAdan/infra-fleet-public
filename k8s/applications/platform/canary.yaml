apiVersion: flagger.app/v1beta1
kind: Canary
metadata:
  name: ${APP_NAME}
  namespace: applications
spec:
  provider: ${TRAFFIC_PROVIDER}
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ${APP_NAME}
  autoscalerRef:
    apiVersion: autoscaling/v2
    kind: HorizontalPodAutoscaler
    name: ${APP_NAME}
  service:
    port: ${APP_PORT}
    targetPort: ${APP_PORT}
  analysis:
    interval: 30s
    maxWeight: 50
    stepWeight: 10
    threshold: 3
    metrics:
      # Reserved Flagger metric names invoke provider-specific built-ins before
      # a template. These distinct names always evaluate the selected profile's
      # explicit MetricTemplate.
      - name: workload-request-success-rate
        templateRef:
          name: request-success-rate
          namespace: applications
        thresholdRange:
          min: 99
        interval: 1m
      - name: workload-request-duration
        templateRef:
          name: request-duration
          namespace: applications
        thresholdRange:
          max: 500
        interval: 1m
    webhooks:
      - name: smoke-test
        type: pre-rollout
        url: http://flagger-loadtester.flux-system/
        timeout: 30s
        metadata:
          type: cmd
          cmd: "hey -z 5s -q 5 -c 2 http://${APP_NAME}-canary.applications:${APP_PORT}${APP_HEALTH_PATH}"
      - name: load-test
        type: rollout
        url: http://flagger-loadtester.flux-system/
        timeout: 15s
        metadata:
          type: cmd
          # This public endpoint participates in chaos injection; probes do not.
          # hey ignores -H 'Host: …' (Go takes the host from the URL), so the
          # routed hostname needs -host or every request misses the app's route.
          cmd: "hey -z 10s -q 10 -c 2 -host ${APP_HOSTNAME} http://${TRAFFIC_ENDPOINT}${APP_LOAD_PATH}"
