# NetworkPolicy - Controls traffic to/from ${APP_NAME} pods
#
# Approach: Permissive egress, restricted ingress
# - Ingress: Only allow known sources (Envoy Gateway, Prometheus, Flux, self)
# - Egress: Allow all for now (app needs Prometheus, DNS, self)
#
# Egress remains an explicitly accepted staging risk; see SECURITY-CONCERNS.md.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ${APP_NAME}
  namespace: applications
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["${APP_NAME}", "${APP_NAME}-primary"]
  policyTypes:
    - Ingress
    - Egress

  # INGRESS: Only allow traffic from known sources
  ingress:
    # Flagger's load tester probes the canary directly before shifting traffic.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: flux-system
      ports:
        - protocol: TCP
          port: ${APP_PORT}
    # Allow traffic from the fleet Gateway (Envoy)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
      ports:
        - protocol: TCP
          port: ${APP_PORT}

    # Allow Prometheus to scrape /metrics
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: ${APP_PORT}

    # Allow ${APP_NAME} pods to communicate with each other
    # (needed for distributed load testing feature)
    - from:
        - podSelector:
            matchLabels:
              app: ${APP_NAME}
      ports:
        - protocol: TCP
          port: ${APP_PORT}

  # EGRESS: Allow all outbound traffic for now
  # The app may reach anything; ingress is what this policy restricts.
  egress:
    - {}
