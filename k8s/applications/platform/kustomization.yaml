# Platform-owned objects for one app, filled with that app's ${APP_*} values:
# from k8s/fleet-app for the selected app, or from the app's own contract when
# the control plane launches it. Shared objects live in ../observability.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - hpa.yaml
  - networkpolicy.yaml
  - canary.yaml
