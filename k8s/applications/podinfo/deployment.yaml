apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo
  namespace: applications
  labels:
    app: podinfo
    managed-by: flux
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: podinfo
  template:
    metadata:
      labels:
        app: podinfo
      annotations:
        infra-fleet.io/runtime-config-revision: "${RUNTIME_CONFIG_REVISION}"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: podinfo
          # The platform binds `app` to the image built from APP_SOURCE.
          image: app
          command: [./podinfo, --port=9898, --level=info]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 9898
              name: http
              protocol: TCP
          env:
            - name: PODINFO_UI_MESSAGE
              value: "Running on Infra Fleet (${ENVIRONMENT})"
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9898
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9898
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
