apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../infrastructure/kyverno
  - ../../../infrastructure/namespaces
  - ../../../infrastructure/helm-repositories/prometheus-community
  - ../../../infrastructure/helm-repositories/flagger
  - ../../../infrastructure/observability
  - ../../../infrastructure/flagger
  - ../../../infrastructure/flagger-loadtester
  - controllers.yaml
patches:
  - target:
      kind: HelmRelease
      name: flagger
    patch: |-
      - op: add
        path: /spec/dependsOn
        value: [{name: envoy-gateway, namespace: envoy-gateway-system}]
  - target:
      kind: HelmRelease
      name: kube-prometheus-stack
    patch: |-
      - op: add
        path: /spec/values/kubeEtcd
        value: {enabled: false}
      - op: add
        path: /spec/values/kubeControllerManager
        value: {enabled: false}
      - op: add
        path: /spec/values/kubeScheduler
        value: {enabled: false}
  # Admission enforcement is the admission controller's job. The reports
  # controller only writes background PolicyReports, which nothing here reads;
  # on a one-node lab its rescans cost more than a core and, after a Docker
  # restart, it lost leader election and rescanned in a loop, adding hundreds
  # of milliseconds to every request and failing healthy canaries.
  - target:
      kind: HelmRelease
      name: kyverno
    patch: |-
      - op: add
        path: /spec/values/reportsController/enabled
        value: false
