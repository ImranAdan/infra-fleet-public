apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../applications
# Every app's container image is named `app`; the platform binds it to the
# image the local facade built from APP_SOURCE.
images:
  - name: app
    newName: ${IMAGE_REGISTRY}/${APP_NAME}
    newTag: ${IMAGE_TAG}
patches:
  - target:
      kind: HorizontalPodAutoscaler
    patch: |-
      - op: replace
        path: /spec/maxReplicas
        value: 3
