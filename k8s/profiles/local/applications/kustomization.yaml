apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../applications
  - metrictemplate.yaml
# Every app's container image is named `app`; the platform binds it to the
# image the local facade built from APP_SOURCE.
images:
  - name: app
    newName: ${IMAGE_REGISTRY}/${APP_NAME}
    newTag: ${IMAGE_TAG}
patches:
  - target:
      kind: HorizontalPodAutoscaler
    patch: |-
      - op: replace
        path: /spec/maxReplicas
        value: 3
  - target:
      kind: NetworkPolicy
    patch: |-
      - op: replace
        path: /spec/ingress/1/from/0/namespaceSelector/matchLabels/kubernetes.io~1metadata.name
        value: envoy-gateway-system
  - target:
      kind: Canary
    patch: |-
      - op: add
        path: /spec/service/hosts
        value: [localhost]
      - op: add
        path: /spec/service/gatewayRefs
        value: [{name: fleet, namespace: envoy-gateway-system}]
