apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../routing
  - issuer.yaml
patches:
  # Locally every app launched from the dashboard gets its own route host,
  # <app>.apps.localhost, so the HTTPS listener accepts any host and the
  # certificate covers them (a wildcard needs two labels after it to verify).
  - target:
      kind: Gateway
      name: fleet
    patch: |-
      - op: remove
        path: /spec/listeners/1/hostname
  - target:
      kind: Certificate
      name: fleet-tls
    patch: |-
      - op: add
        path: /spec/dnsNames/-
        value: "*.apps.localhost"
