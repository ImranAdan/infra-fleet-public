# Local certificates come from an in-cluster CA: a self-signed root signs the
# fleet's local CA, which issues every local certificate. Nothing outside the
# machine can reach the cluster; in-cluster clients such as the application
# dashboard verify the Gateway against this CA (every certificate it issues
# carries it as ca.crt), and Flagger's load tests skip verification.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: fleet-local-root
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: fleet-local-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: Infra Fleet Local CA
  secretName: fleet-local-ca
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    kind: ClusterIssuer
    name: fleet-local-root
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: fleet-issuer
spec:
  ca:
    secretName: fleet-local-ca
