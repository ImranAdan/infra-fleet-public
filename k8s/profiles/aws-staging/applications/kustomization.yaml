apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../applications
  - pdb.yaml
patches:
  # Two replicas so a node drain never takes the app offline; the cost of the
  # extra pod is accepted for AWS staging (advisor R-005). Local stays at one.
  - target:
      kind: HorizontalPodAutoscaler
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
images:
  # Every app's container image is named `app`. Flux image automation keeps
  # this tag on the newest release of ${IMAGE_REGISTRY}/${APP_NAME}.
  - name: app
    newName: ${IMAGE_REGISTRY}/${APP_NAME}
    newTag: v1.6.4 # {"$imagepolicy": "flux-system:app:tag"}
