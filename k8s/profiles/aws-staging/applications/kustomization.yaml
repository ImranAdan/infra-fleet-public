apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../applications
  - ingress-nginx.yaml
  - metrictemplate.yaml
images:
  - name: load-harness
    newName: ${IMAGE_REGISTRY}/load-harness
    newTag: v1.6.4 # {"$imagepolicy": "flux-system:load-harness:tag"}
patches:
  - target:
      kind: Canary
      name: load-harness
    patch: |-
      - op: add
        path: /spec/ingressRef
        value:
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          name: load-harness
      - op: replace
        path: /spec/analysis/metrics/0/templateRef/name
        value: nginx-request-success-rate
      - op: add
        path: /spec/analysis/metrics/0/templateVariables
        value: {ingress: load-harness}
      - op: replace
        path: /spec/analysis/metrics/1/templateRef/name
        value: nginx-request-duration
      - op: add
        path: /spec/analysis/metrics/1/templateVariables
        value: {ingress: load-harness}
