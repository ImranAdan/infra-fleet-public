apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../applications
images:
  # Every app's container image is named `app`. Flux image automation keeps
  # this tag on the newest release of ${IMAGE_REGISTRY}/${APP_NAME}.
  - name: app
    newName: ${IMAGE_REGISTRY}/${APP_NAME}
    newTag: v1.6.4 # {"$imagepolicy": "flux-system:app:tag"}
