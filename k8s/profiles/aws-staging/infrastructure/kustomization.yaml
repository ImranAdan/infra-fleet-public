apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../infrastructure
patches:
  - target:
      kind: HelmRelease
      name: kube-prometheus-stack
    patch: |-
      - op: add
        path: /spec/dependsOn
        value: [{name: aws-load-balancer-controller, namespace: kube-system}]
  - target:
      kind: HelmRelease
      name: flagger
    patch: |-
      - op: add
        path: /spec/dependsOn
        value: [{name: envoy-gateway, namespace: envoy-gateway-system}]
  # The AWS Load Balancer Controller's webhook intercepts Service resources, so
  # controllers that create Services install after it.
  - target:
      kind: HelmRelease
      name: envoy-gateway
    patch: |-
      - op: add
        path: /spec/dependsOn
        value: [{name: aws-load-balancer-controller, namespace: kube-system}]
  - target:
      kind: HelmRelease
      name: cert-manager
    patch: |-
      - op: add
        path: /spec/dependsOn/-
        value: {name: aws-load-balancer-controller, namespace: kube-system}
