# Let's Encrypt for the public hostname. HTTP-01 challenges are answered by a
# temporary HTTPRoute cert-manager attaches to the Gateway's http listener; its
# exact challenge path wins over the catch-all HTTPS redirect.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: fleet-issuer
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ${ACME_EMAIL}
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: fleet
                namespace: envoy-gateway-system
                sectionName: http
