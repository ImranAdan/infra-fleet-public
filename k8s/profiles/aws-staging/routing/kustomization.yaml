apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../routing
  - issuer.yaml
patches:
  # Expose the Gateway through an internet-facing NLB. Cloudflare DNS points
  # ${APP_HOSTNAME} at it (rebuild-stack.yml).
  - target:
      kind: EnvoyProxy
      name: fleet
    patch: |-
      - op: replace
        path: /spec/provider/kubernetes/envoyService/type
        value: LoadBalancer
      - op: add
        path: /spec/provider/kubernetes/envoyService/annotations
        value:
          service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
          service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
          service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
          service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
          service.beta.kubernetes.io/aws-load-balancer-additional-resource-tags: "Environment=staging,ManagedBy=flux,Component=envoy-gateway"
