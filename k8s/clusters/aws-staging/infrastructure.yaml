apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure
  namespace: flux-system
spec:
  interval: 1m
  path: ./k8s/profiles/aws-staging/infrastructure
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 15m
  dependsOn:
    - name: configuration
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: fleet-config
      - kind: ConfigMap
        name: fleet-app
