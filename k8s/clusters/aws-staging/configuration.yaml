apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: configuration
  namespace: flux-system
spec:
  interval: 1m
  path: ./k8s/profiles/aws-staging/configuration
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 5m
  # The root applies k8s/fleet-app; wait until it has applied this revision,
  # so an app swap never pairs new manifests with the previous app contract.
  dependsOn:
    - name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: terraform-outputs
