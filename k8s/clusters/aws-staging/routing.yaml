apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: routing
  namespace: flux-system
spec:
  interval: 1m
  path: ./k8s/profiles/aws-staging/routing
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # A certificate for an unset or unresolved hostname never becomes Ready;
  # applications must still deploy and stay reachable by port-forward.
  wait: false
  timeout: 15m
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: fleet-config
      - kind: ConfigMap
        name: fleet-app
  dependsOn:
    - name: infrastructure
