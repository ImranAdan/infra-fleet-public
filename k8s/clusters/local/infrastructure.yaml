apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure
  namespace: flux-system
spec:
  interval: 1m
  path: ./k8s/profiles/local/infrastructure
  prune: true
  sourceRef:
    kind: GitRepository
    name: fleet-local
  wait: true
  timeout: 15m
  # The root applies k8s/fleet-app; wait until it has applied this revision,
  # so an app swap never pairs new manifests with the previous app contract.
  dependsOn:
    - name: fleet-root
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: fleet-config
      - kind: ConfigMap
        name: fleet-app
