apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: routing
  namespace: flux-system
spec:
  interval: 1m
  path: ./k8s/profiles/local/routing
  prune: true
  sourceRef:
    kind: GitRepository
    name: fleet-local
  wait: false
  timeout: 15m
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: fleet-config
  dependsOn:
    - name: infrastructure
