# Nothing in the namespace accepts ingress unless a policy below admits it,
# so a new pod or a chart label change can never expose the broker.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-messaging
  namespace: messaging
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Only applications reach the broker; Prometheus scrapes the exporter.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nats
  namespace: messaging
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nats
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: applications
      ports:
        - protocol: TCP
          port: 4222
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 7777
