---
# cert-manager - Automatic TLS Certificate Management
#
# =============================================================================
# PURPOSE
# =============================================================================
# cert-manager automates TLS certificate issuance and renewal using Let's Encrypt.
# It issues the configured staging hostname through Let's Encrypt and the local
# profile's in-cluster CA through the profile-specific ClusterIssuer.
#
# Traffic flow with TLS:
#   Client -> NLB (TCP passthrough) -> Envoy Gateway (TLS termination) -> Pod
#
# Certificate lifecycle:
#   1. Certificate and Gateway resources are reconciled
#   2. cert-manager requests cert from Let's Encrypt
#   3. Let's Encrypt performs HTTP-01 challenge through Gateway API
#   4. Certificate stored in K8s Secret
#   5. Envoy Gateway uses the Secret for TLS termination
#   6. cert-manager auto-renews before expiry
#
# =============================================================================
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  # The Gateway API CRDs must exist before cert-manager starts with Gateway support.
  dependsOn:
    - name: envoy-gateway
      namespace: envoy-gateway-system
  targetNamespace: cert-manager
  interval: 1h
  chart:
    spec:
      chart: cert-manager
      version: "v1.21.1"
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
      interval: 1h
  install:
    crds: CreateReplace
    createNamespace: true
  upgrade:
    crds: CreateReplace
  values:
    # Install CRDs with Helm (required for ClusterIssuer)
    installCRDs: true

    # ACME HTTP-01 challenges are answered through the fleet Gateway (HTTPRoute).
    config:
      apiVersion: controller.config.cert-manager.io/v1alpha1
      kind: ControllerConfiguration
      enableGatewayAPI: true

    # Resource limits for t3.large node
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi

    # Webhook resources
    webhook:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 50m
          memory: 64Mi

    # CA Injector resources
    cainjector:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 50m
          memory: 128Mi
