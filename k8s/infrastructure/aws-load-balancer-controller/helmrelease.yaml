---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: aws-load-balancer-controller
  namespace: kube-system
spec:
  interval: 10m
  # Recover without an operator: a slow chart gets 5m, and a failed
  # install or upgrade is retried, an upgrade rolling back first.
  timeout: 5m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: aws-load-balancer-controller
      version: 3.5.0
      sourceRef:
        kind: HelmRepository
        name: eks-charts
        namespace: flux-system
      interval: 1h
  values:
    # Parameterized values injected by Flux from terraform-outputs ConfigMap
    # See infrastructure/staging/outputs-configmap.tf for value definitions
    clusterName: ${CLUSTER_NAME}

    # ServiceAccount configuration
    serviceAccount:
      create: true
      name: aws-load-balancer-controller
      # IAM role is managed by Terraform and associated via EKS Pod Identity

    # VPC and region configuration
    # These values are dynamically injected on every cluster rebuild
    region: ${AWS_REGION}
    vpcId: ${VPC_ID}

    # Single replica for pod capacity (t3.large = 35 pods max)
    # Running 1 replica is acceptable for this manually torn-down staging lab
    replicaCount: 1

    # Resource limits
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

    # Enable logging
    enableShield: false
    enableWaf: false
    enableWafv2: false
