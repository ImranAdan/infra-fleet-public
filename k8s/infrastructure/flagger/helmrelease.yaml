---
# Flagger - Progressive Delivery Controller
#
# Flagger automates canary deployments by:
# 1. Creating primary/canary versions of deployments
# 2. Gradually shifting traffic based on metrics
# 3. Rolling back automatically on failures
#
# =============================================================================
# TRAFFIC PROVIDER: SELECTED BY THE DEPLOYMENT PROFILE
# =============================================================================
# Local uses gatewayapi:v1 with Envoy Gateway. AWS staging uses nginx. Both
# providers support the configured weighted progression from 10% through 50%.
#
# Metrics: Prometheus via kube-prometheus-stack
# =============================================================================
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flagger
  namespace: flux-system
spec:
  interval: 1h
  chart:
    spec:
      chart: flagger
      version: "1.45.0"
      sourceRef:
        kind: HelmRepository
        name: flagger
        namespace: flux-system
      interval: 1h
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    # Prometheus for metrics analysis
    metricsServer: http://kube-prometheus-stack-prometheus.observability:9090

    # The profile selects Gateway API or NGINX weighted routing.
    meshProvider: ${TRAFFIC_PROVIDER}

    # Resource limits for t3.large node
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi
