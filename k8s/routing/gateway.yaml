# The fleet's one way in, shared by every profile. Profiles set only how the
# Envoy Service is exposed and which issuer signs the certificate.
#
#   http  :80   redirects to HTTPS; serves nothing else except cert-manager's
#               ACME HTTP-01 challenge routes (created in this namespace)
#   https :443  terminates TLS for ${APP_HOSTNAME}; application routes attach here
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: fleet
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        # A stable name, so TRAFFIC_ENDPOINT and DNS automation need no lookup.
        name: fleet-gateway
        type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: fleet
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: fleet
    namespace: envoy-gateway-system
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: fleet
  namespace: envoy-gateway-system
spec:
  gatewayClassName: fleet
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      port: 443
      protocol: HTTPS
      hostname: ${APP_HOSTNAME}
      tls:
        mode: Terminate
        certificateRefs:
          - name: fleet-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: applications
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: envoy-gateway-system
spec:
  parentRefs:
    - name: fleet
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: fleet-tls
  namespace: envoy-gateway-system
spec:
  secretName: fleet-tls
  dnsNames:
    - ${APP_HOSTNAME}
  issuerRef:
    kind: ClusterIssuer
    name: fleet-issuer # each profile supplies this issuer
